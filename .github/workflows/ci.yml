name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # 仓库级测试套件(与 package.json test 脚本一致)。插件运行时(media-ops/office-suite)
      # 是自带 package.json+lockfile 的子项目,裸 bun test 会在未装其依赖的情况下捞进它们的
      # 测试导致必红(zod 缺失),故显式限定路径。
      - run: bun test ./tests/
      - run: bun run build
      - run: bun run lint:brand
      - run: bun run scripts/lint-brand.ts dist
      - run: bun run validate
      - name: Verify media-ops standalone bundle is committed
        run: git ls-files --error-unmatch plugins/crabcode-media-ops/dist/server.js

  security-plugin:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: bun install --frozen-lockfile
      - name: Fetch the immutable upstream source snapshot
        env:
          # Force the https transport so a tampered lock cannot select a
          # remote-helper transport (e.g. ext::) that would execute a command.
          GIT_ALLOW_PROTOCOL: https
        run: |
          # SOURCE-LOCK.json is repository-tracked and therefore attacker-controllable
          # on a fork pull_request. Validate its values before handing them to git:
          # require an https github.com URL free of shell/transport metacharacters and a
          # bare 40-hex commit id. This blocks SSRF to arbitrary hosts, ext:: remote-helper
          # execution, and argument/refspec injection via git fetch; well-formed but wrong
          # content is still rejected downstream by the provenance verifier.
          UPSTREAM_REPOSITORY="$(jq -r '.upstream.repository' plugins/crabcode-security/docs/legal/SOURCE-LOCK.json)"
          UPSTREAM_COMMIT="$(jq -r '.upstream.commit' plugins/crabcode-security/docs/legal/SOURCE-LOCK.json)"
          case "${UPSTREAM_REPOSITORY}" in
            https://github.com/*) : ;;
            *) echo "::error::Refusing to fetch: upstream.repository must be an https://github.com/ URL." >&2; exit 1 ;;
          esac
          case "${UPSTREAM_REPOSITORY}" in
            *[!A-Za-z0-9:/._-]*) echo "::error::Refusing to fetch: upstream.repository has unexpected characters." >&2; exit 1 ;;
          esac
          case "${UPSTREAM_COMMIT}" in
            "" | *[!0-9a-f]*) echo "::error::Refusing to fetch: upstream.commit must be a lowercase 40-hex commit id." >&2; exit 1 ;;
          esac
          if [ "${#UPSTREAM_COMMIT}" -ne 40 ]; then
            echo "::error::Refusing to fetch: upstream.commit must be a lowercase 40-hex commit id." >&2
            exit 1
          fi
          git init "${RUNNER_TEMP}/crabcode-security-upstream"
          git -C "${RUNNER_TEMP}/crabcode-security-upstream" remote add origin "${UPSTREAM_REPOSITORY}"
          git -C "${RUNNER_TEMP}/crabcode-security-upstream" -c protocol.ext.allow=never fetch --depth=1 origin "${UPSTREAM_COMMIT}"
          git -C "${RUNNER_TEMP}/crabcode-security-upstream" checkout --detach FETCH_HEAD
      - name: Verify upstream provenance and the complete target port
        run: >-
          bun run scripts/verify-crabcode-security-port.ts
          "${RUNNER_TEMP}/crabcode-security-upstream"
      - name: Verify the full port patch is reproducible
        run: >-
          bun run scripts/build-crabcode-security-port-patch.ts
          --check
          "${RUNNER_TEMP}/crabcode-security-upstream"
      - run: bun test ./tests/crabcode-security/
        env:
          CRABCODE_SECURITY_UPSTREAM_CHECKOUT: ${{ runner.temp }}/crabcode-security-upstream
      - run: sh -n plugins/crabcode-security/hooks/banner_hook.sh
      - name: Byte-compile the plugin's Python sources
        env:
          # runner.temp is available at step scope (not job scope); keep py_compile
          # bytecode out of the checked-out workspace.
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/crabcode-security-pycache
        run: >-
          python -m py_compile
          plugins/crabcode-security/hooks/banner_notice.py
          plugins/crabcode-security/scripts/patch_artifacts.py
          plugins/crabcode-security/scripts/render_report.py
          plugins/crabcode-security/scripts/write_scan_meta.py
      - name: Verify executable source files keep mode 100755
        run: |
          test "$(git ls-files -s plugins/crabcode-security/hooks/banner_hook.sh | cut -d' ' -f1)" = "100755"
          test "$(git ls-files -s plugins/crabcode-security/hooks/banner_notice.py | cut -d' ' -f1)" = "100755"
          test "$(git ls-files -s plugins/crabcode-security/scripts/patch_artifacts.py | cut -d' ' -f1)" = "100755"
          test "$(git ls-files -s plugins/crabcode-security/scripts/render_report.py | cut -d' ' -f1)" = "100755"
          test "$(git ls-files -s plugins/crabcode-security/scripts/write_scan_meta.py | cut -d' ' -f1)" = "100755"

  html-video-plugin:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plugins/crabcode-html-video

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:mcp
      - run: bun test ./tests ./packages
      - run: bun run check:distribution
      - name: Verify committed standalone bundle is complete and current
        run: |
          git ls-files --error-unmatch dist/bootstrap.js dist/server.js dist/hyperframe.manifest.json dist/hyperframe.runtime.iife.js
          test -z "$(git status --porcelain -- dist)"

  media-ops-plugin:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host

    defaults:
      run:
        working-directory: plugins/crabcode-media-ops

    steps:
      - uses: actions/checkout@v4
      # The Playwright container image ships without unzip, which oven-sh/setup-bun
      # needs to unpack the bun release archive. Without it setup-bun fails and the
      # whole job (check:distribution + QA) never runs on Linux. Install it first.
      # Verified against the pinned image by local container reproduction (audit 2026-07-18).
      - name: Install unzip (Playwright image lacks it; required by setup-bun)
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # check:distribution rebuilds into a temp dir and compares against the
      # committed dist/server.js, then cold-start smokes it — so it must run
      # before anything overwrites the checked-out bundle.
      - run: bun run check:distribution
      - run: bun run test
      - run: bun run test:qa
      - run: bun run qa:release
      - run: bun run validate
      - name: Upload media QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-ops-qa-evidence
          path: plugins/crabcode-media-ops/test-results
          if-no-files-found: ignore
