name: Publish official plugin marketplace to China mirror

# 把本仓(官方插件市场)打成 content-addressed zip,发布到中国镜像
# updates.acosmi.com/crabcode/plugins/crabcode-plugins-official/{latest,<sha>.zip},
# 并把同一 checkout 的 marketplace.json 发布到同一前缀(acosmi.com/skill 插件页
# 同源主源与 updates.acosmi.com 远程兜底都读它)。
#
# 迁移史(2026-08-17 用户裁决):此工作流原住企业源码仓
# acosmi/crabcode-source(.github/workflows/sync-plugins-to-mirror.yml),
# 因为镜像部署密钥当时只在那边。用户裁定「插件发版应住插件仓」,遂迁入本仓,
# 配**专用**部署密钥(见下),旧工作流同日退役。发布语义逐字节继承,含:
#   - zip 布局契约(zip 内所有文件前缀 = marketplaces/crabcode-plugins-official/,
#     客户端 strip 该前缀提取;exec 位经 zip 中央目录 external_attr 恢复,故必须
#     用 `zip` 命令而非纯 deflate)
#   - latest = 被发布的那个源 SHA(纯文本指针);{sha}.zip content-addressed 可永久缓存
#   - 镜像瘦身清单 .crabcode-plugin/mirror-distribution.json(三方同源:本发布器
#     与审计器 notify-mirror.yml 从同一个被审 SHA 的 checkout 读同一份清单)
#   - 先落 zip+json+.sha256,最后切 latest 指针(原子)
#
# 密钥边界(为什么公开仓可以持有这个 secret):MIRROR_SSH_KEY 是**专用**
# 写单向部署钥,服务器侧 authorized_keys 以
#   restrict,command="rrsync -wo /var/www/updates/crabcode"
# 锁死 —— 无 shell、无端口转发、只能 rsync 写入镜像内容目录。其爆炸半径
# (改写镜像插件内容)与「本仓 main 被合入恶意内容后被如实发布」完全同阶,
# 不引入任何新的信任面;它**不是**企业仓 CI 的那把钥匙,两把可独立吊销。
# fork PR 天然读不到 secrets(GitHub 默认),workflow_dispatch 需要写权限。
#
# 触发(W-PUBLISH-PROVENANCE-GATE PR-1,2026-08-17 改):
#   - `workflow_run`:CI 在 main 的 push 上**跑完且绿**才触发。此前是裸 `push: main`,
#     发布器与 CI 同时起跑 ⇒ 发布器把一个还没测完(甚至已经红了)的 commit 发出去,
#     而审计器 notify-mirror.yml 只接受绿 SHA ⇒ 生产侧无门、消费侧要门,镜像会卡在
#     一个审计器永远判红的状态,直到有人再推一个绿 commit。**那正是本立项的病本身**,
#     只不过迁仓之后缩小到了一个仓里。
#     刻意不选「push 触发 + 原地等 CI」:那要让 runner 空转整段 CI 时长,而 Actions
#     额度是本仓的硬约束(2026-07-27 已为额度删过一次 schedule)。
#   - `workflow_dispatch`:手动补发,目标同样走「最近一个绿的 main push commit」,
#     不是 HEAD。
#   **刻意无 schedule**(2026-07-27 教训:每 30 分钟轮询单独吃掉整月 Actions 额度)。
#
# 「发哪个 commit」的判据只写一份:.crabcode-plugin/latest-green-main.py,审计器
# notify-mirror.yml 调的是**同一个文件**。把「加一道门」翻转成「两边用同一条规则算
# 同一个答案」—— 门会挡人(本仓 main 若哪天红了,fail-closed 就是永远发不出去),
# 同源不会。
#
# 幂等:目标 SHA 的字节已经在镜像上且自洽就整段早退(resolve job 的 preflight)。
# 这**不是省事项**:zip 按源 SHA 定址 + zip 字节对 mtime 敏感 + 镜像给 zip 发一年
# `immutable` ⇒ 重跑同一个 SHA = 同名对象换字节 = 「缓存 zip × 新 sidecar」撕裂对,
# 客户端摘要校验 fail-closed 回退 git。判据与发布后验收共用同一个
# .crabcode-plugin/verify-mirror-bundle.py。

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# 手动补发与 workflow_run 触发可能撞车 → 串行不取消,保证 latest 指针切换有序。
concurrency:
  group: publish-cn-mirror
  cancel-in-progress: false

# 两个 job 都要问镜像同一个基址 —— 提到 workflow 级,免得同一个常量在一个文件里写两遍。
env:
  MIRROR_PUBLIC_BASE: https://updates.acosmi.com/crabcode

jobs:
  resolve:
    name: Resolve latest green main commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # fork 里不跑(fork 也读不到 secrets,这里让它连 runner 都不占)。
    # workflow_run 会为**每一次** CI run 触发,包括 PR 上的和红的 —— 只放行
    # 「main 上的 push 且绿」那一类;选择器本身也会再验一遍这四条(fail-closed)。
    if: >-
      github.repository == 'acosmi/CrabCode-Plugin'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_branch == 'main'))
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ci_url: ${{ steps.pick.outputs.ci_url }}
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      # 规则文本从默认分支 HEAD 读 —— 这一步是**构造上不可避免**的:规则要选出
      # SHA_G,就不可能从「被它选出的那个 SHA」里读规则(与瘦身清单相反,那份清单
      # 作用在选定**之后**,所以它从被审 SHA 读)。这段 HEAD 依赖只覆盖规则文本本身,
      # 内容打包用的是下面 publish job 里 `ref: SHA_G` 的钉死 checkout。
      - name: Checkout the selection rule (default branch HEAD)
        uses: actions/checkout@v6
        with:
          path: rule-src
          fetch-depth: 1

      - name: Pick the latest green main push commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch 时是 "null";选择器会忽略。带上它是为了消掉
          # 「触发本次发布的那条 run 还没出现在 REST 列表里」的最终一致性缝隙 ——
          # 少了这一手,最坏情况是新绿 commit 永远轮不到发布(静默漏发)。
          TRIGGER_RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          RUNS="${RUNNER_TEMP}/ci-runs.json"
          TRIGGER="${RUNNER_TEMP}/trigger-run.json"
          printf '%s' "${TRIGGER_RUN}" > "${TRIGGER}"
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "${RUNS}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100'
          read -r SHA CI_URL < <(
            python3 rule-src/.crabcode-plugin/latest-green-main.py \
              --runs "${RUNS}" --extra-run "${TRIGGER}"
          )
          {
            echo "sha=${SHA}"
            echo "ci_url=${CI_URL}"
          } >> "${GITHUB_OUTPUT}"
          echo "将发布 ${SHA}(CI: ${CI_URL})"

      - name: Skip when the mirror already serves this commit
        id: preflight
        run: |
          set -euo pipefail
          BASE="${MIRROR_PUBLIC_BASE}/plugins/crabcode-plugins-official"
          if python3 rule-src/.crabcode-plugin/verify-mirror-bundle.py \
               --base "${BASE}" --sha "${{ steps.pick.outputs.sha }}"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "镜像已在该 commit 上自洽 → 整段早退,一个字节都不重传。" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "镜像未就位或不自洽 → 继续发布。"
          fi

  publish:
    name: Pack + publish official marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resolve
    # fork 守卫由 resolve 承担(needs 链上游被 skip ⇒ 本 job 也 skip),这里重述一遍
    # 是为了单看这个 job 也能读出「公开仓 fork 里不跑」。
    if: >-
      github.repository == 'acosmi/CrabCode-Plugin'
      && needs.resolve.outputs.skip != 'true'
    permissions:
      contents: read
    env:
      MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
      MIRROR_PATH: ${{ secrets.MIRROR_PATH }}
      MIRROR_USER: crabdeploy
      ARC_PREFIX: marketplaces/crabcode-plugins-official
      TARGET_SHA: ${{ needs.resolve.outputs.sha }}

    steps:
      # `ref:` 钉死 resolve 选出的绿 SHA —— 顺带关掉 TOCTOU:旧形态是「解析 HEAD」
      # 与「checkout」之间 HEAD 可以前进,zip、latest 指针与绿判据可能落在三个不同的
      # commit 上。现在三者对同一个 SHA。
      - name: Checkout this marketplace at the resolved green commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: marketplace-src
          fetch-depth: 1

      # 验收脚本是**工具**不是契约输入,从默认分支 HEAD 取(与 resolve job 同一份);
      # 而下面打包用的瘦身清单 mirror-distribution.json 是契约输入,仍从被打包的那个
      # SHA 的 checkout 读 —— 它必须与审计器读的是同一个 commit 的同一份清单。
      - name: Checkout the verification tooling (default branch HEAD)
        uses: actions/checkout@v6
        with:
          path: rule-src
          fetch-depth: 1

      - name: Validate marketplace.json (防半包发布给网站)
        run: |
          set -euo pipefail
          python3 - marketplace-src/.crabcode-plugin/marketplace.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          plugins = d.get("plugins")
          assert isinstance(plugins, list) and len(plugins) > 0, "plugins 为空"
          miss = [p["name"] for p in plugins if not p.get("displayName")]
          meta = d.get("metadata") or {}
          print(f"plugins={len(plugins)} version={meta.get('version')} missing_displayName={len(miss)}")
          PY

      - name: Build content-addressed zip
        id: pack
        run: |
          set -euo pipefail
          # SHA 来自 resolve job 的绿判据,**不是** `git rev-parse HEAD` —— 后者正是
          # 本立项在改的东西(「此刻是什么就发什么」)。这里再自证一次 checkout 真的
          # 落在那个 commit 上:两者对不上说明 ref: 没生效,当场停,别发。
          SHA="${TARGET_SHA}"
          CHECKED_OUT="$(git -C marketplace-src rev-parse HEAD)"
          if [ "${CHECKED_OUT}" != "${SHA}" ]; then
            echo "::error::checkout 落在 ${CHECKED_OUT},与解析出的绿 SHA ${SHA} 不符"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Official marketplace green commit: ${SHA}"
          # zip 内布局:全部文件挪到 ARC_PREFIX/ 下(剔除 .git);保留可执行位。
          STAGE="zipstage/${ARC_PREFIX}"
          mkdir -p "${STAGE}"
          rsync -a --exclude='.git' marketplace-src/ "${STAGE}/"
          # 镜像分发裁剪(W-PLUGIN-MIRROR-SLIM):可选清单
          # .crabcode-plugin/mirror-distribution.json 声明「不进镜像 zip」的目录
          # 前缀。三方同源契约:本发布器与审计器 notify-mirror.yml 都从**同一个
          # checkout(同一 SHA)**读同一份清单推导文件集,构造上不可能分叉 ——
          # 刻意不在两个 workflow 里各写一份排除表。清单不存在时两侧同样为空 =
          # 与旧行为逐字节一致。
          # 安全栅(两侧同款):每个前缀必须含 "/tests/" —— 清单只许裁测试资产,
          # 构造上裁不掉运行时内容(插件 manifest / dist / skills);违规当场 fail。
          python3 - marketplace-src/.crabcode-plugin/mirror-distribution.json "${STAGE}" <<'PY'
          import json, pathlib, sys
          manifest_path, stage = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          if not manifest_path.exists():
              print("mirror-distribution.json 不存在 → 不裁剪(与旧行为一致)")
              raise SystemExit(0)
          data = json.load(manifest_path.open(encoding="utf-8"))
          prefixes = data.get("excludePrefixes", [])
          if not isinstance(prefixes, list) or not all(isinstance(p, str) for p in prefixes):
              raise SystemExit("excludePrefixes 必须是字符串数组")
          for p in prefixes:
              if "/tests/" not in p:
                  raise SystemExit(f"排除前缀必须含 /tests/(清单只许裁测试资产): {p}")
              if p.startswith("/") or "\\" in p or ".." in p.split("/"):
                  raise SystemExit(f"排除前缀必须是仓内相对 POSIX 路径: {p}")
          removed_files = removed_bytes = 0
          per_prefix = {p: 0 for p in prefixes}
          for path in sorted(stage.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(stage).as_posix()
              for p in prefixes:
                  if rel.startswith(p):
                      removed_bytes += path.stat().st_size
                      removed_files += 1
                      per_prefix[p] += 1
                      path.unlink()
                      break
          for path in sorted(
              (d for d in stage.rglob("*") if d.is_dir()),
              key=lambda d: len(d.parts),
              reverse=True,
          ):
              try:
                  path.rmdir()  # 只删空目录,防 zip 里残留幽灵目录项
              except OSError:
                  pass
          for p, n in per_prefix.items():
              mark = "⚠️ 0 命中(前缀已陈旧?清单该清理了)" if n == 0 else "✓"
              print(f"{mark} {p} → 裁剪 {n} 个文件")
          print(f"镜像裁剪合计: {removed_files} 文件 / {removed_bytes/1048576:.2f} MB(未压缩)")
          PY
          # ⚠️ 打包目标必须是 ${ARC_PREFIX} 整串,不能只写顶层的 "marketplaces"
          # (W-PLUGIN-MIRROR-ARCPREFIX):`zip -ry … marketplaces` 会额外存一条
          # **裸目录项** `marketplaces/`,不满足布局契约,被审计器判
          # `unsafe archive entry` 而整单红。实测:
          #   `zip -ry … marketplaces` → 条目含 `marketplaces/`;
          #   `zip -ry … marketplaces/crabcode-plugins-official` → 不含,其余逐条相同。
          ( cd zipstage && zip -ry "${GITHUB_WORKSPACE}/${SHA}.zip" "${ARC_PREFIX}" )
          printf '%s' "${SHA}" > latest
          echo "zip 大小:" && ls -la "${SHA}.zip"
          # 自检用审计器的真判据(全称量词):**每一条**条目都必须带 ARC_PREFIX。
          # 「至少有一条带前缀」在有无越界项两种状态下给同一个答案,照不到 bug。
          python3 - "${SHA}.zip" "${ARC_PREFIX}/" <<'PY'
          import sys, zipfile
          archive, prefix = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive) as bundle:
              names = [item.filename for item in bundle.infolist()]
          if not names:
              raise SystemExit("zip 为空")
          bad = [name for name in names if not name.startswith(prefix)]
          if bad:
              raise SystemExit(f"zip 含 {len(bad)} 条越界项(客户端会丢弃/审计器会判 unsafe): {bad[:10]}")
          print(f"✓ 全部 {len(names)} 条条目均以 {prefix} 开头")
          PY

      - name: Setup deploy SSH
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in MIRROR_SSH_KEY MIRROR_KNOWN_HOSTS MIRROR_HOST; do
            if [ -z "${!v:-}" ]; then
              echo "::error::${v} secret 未设置"
              exit 1
            fi
          done
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${MIRROR_SSH_KEY}" > "${HOME}/.ssh/mirror_deploy"
          chmod 600 "${HOME}/.ssh/mirror_deploy"
          printf '%s\n' "${MIRROR_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          echo "RSYNC_RSH=ssh -i ${HOME}/.ssh/mirror_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: rsync to mirror plugins/ (content zip first, latest pointer last)
        run: |
          set -euo pipefail
          SHA="${{ steps.pack.outputs.sha }}"
          DEST_BASE="${MIRROR_PATH:-.}"
          DEST="${MIRROR_USER}@${MIRROR_HOST}"
          PLUGIN_DIR="plugins/crabcode-plugins-official"
          RSYNC() {
            local attempt
            for attempt in 1 2 3; do
              if rsync -rtv --chmod=D755,F644 -e "${RSYNC_RSH}" "$@"; then
                return 0
              fi
              echo "::warning::rsync 第 ${attempt} 次失败,$((attempt * 20))s 后重试"
              sleep $((attempt * 20))
            done
            return 1
          }
          # crabdeploy 的 key 被 rrsync(-wo)forced command 锁死,只准 rsync、拒绝
          # 任意 ssh(mkdir → "is not rsync")。rsync 默认不创建多级父目录,故同步
          # **顶层 plugins 目录**(源不带尾斜杠)到 DEST_BASE → rsync 在限定目录内
          # 递归创建子路径,这是 rrsync 允许的标准行为,无需预建目录。
          # ① 先传 content-addressed zip + 同 commit 的 marketplace.json
          #    (latest 指向它们之前内容必须已就位 = 原子)
          mkdir -p "stage/${PLUGIN_DIR}"
          cp "${SHA}.zip" "stage/${PLUGIN_DIR}/"
          cp marketplace-src/.crabcode-plugin/marketplace.json "stage/${PLUGIN_DIR}/marketplace.json"
          # 校验和(W-PLUGIN-MIRROR-CHECKSUM):审计器 notify-mirror.yml 必需这两个
          # 文件,缺任一即 fail-closed。解析正则 `([0-9a-f]{64})  ([A-Za-z0-9._-]+)\n?`:
          # **恰两个空格 + 纯 basename**。
          # ⚠️ 不直接重定向 `sha256sum` 原生输出:其分隔符随平台变(POSIX 文本模式
          # `<hash>␠␠<file>` 合规;Windows/MSYS 二进制模式 `<hash>␠*<file>` 不合规)。
          # 「靠平台默认值恰好对」会在换执行池那天静默变红 —— 故只取第一字段,
          # printf 显式拼出审计器要的形态。与各自载荷同一次 RSYNC 上传,让
          # 「载荷与摘要不一致」的窗口最小。
          emit_sha256() {
            printf '%s  %s\n' "$(sha256sum "$1" | cut -d' ' -f1)" "$1"
          }
          (
            cd "stage/${PLUGIN_DIR}"
            emit_sha256 "${SHA}.zip" > "${SHA}.zip.sha256"
            emit_sha256 marketplace.json > marketplace.json.sha256
          )
          RSYNC "stage/plugins" "${DEST}:${DEST_BASE}/"
          echo "✓ ${SHA}.zip + marketplace.json + 两个 .sha256 已就位"
          # ② 最后切 latest 指针(原子切换;不带 --delete,不影响已传的 zip)
          mkdir -p "stage-latest/${PLUGIN_DIR}"
          cp latest "stage-latest/${PLUGIN_DIR}/"
          RSYNC "stage-latest/plugins" "${DEST}:${DEST_BASE}/"
          echo "✓ latest 指针已切换 → ${SHA}"

      # 发布后验收 = 发布前幂等判据的**同一个脚本**(校验和必须真的校验:只断言 200
      # 等于只证明「有个文件在那」)。写成两份就是本立项在治的病缩小到一个文件之内。
      - name: Verify the published bundle (same predicate as the pre-flight skip)
        run: |
          set -euo pipefail
          python3 rule-src/.crabcode-plugin/verify-mirror-bundle.py \
            --base "${MIRROR_PUBLIC_BASE}/plugins/crabcode-plugins-official" \
            --sha "${{ steps.pack.outputs.sha }}"
          echo "官方插件市场镜像已就位,国内客户端启动将走镜像而非 GitHub git clone。"
