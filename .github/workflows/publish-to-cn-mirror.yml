name: RETIRED unsafe CN mirror publisher

# Workflow ID 336369746 is retired because its historical push runs can reuse
# the old repository-level mirror credential when re-run. The ID is disabled
# through the GitHub Actions API and preserved as an audit tombstone; safe
# publication lives in publish-safe-to-cn-mirror.yml under a distinct workflow
# ID. Re-enabling this workflow is a release blocker.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse all execution from the retired publisher identity
        run: |
          echo "::error::workflow ID 336369746 is retired; use publish-safe-to-cn-mirror.yml"
          exit 1
