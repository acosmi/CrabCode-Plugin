name: Audit CN mirror freshness

# The mirror deploy credential lives in this repository's secrets: a dedicated
# write-only key used only by publish-safe-to-cn-mirror.yml after retirement of
# the historical publisher identity.
# This audit remains read-only and secret-free. All automatic schedules are paused;
# invoke it through workflow_dispatch after a manually dispatched global CI and mirror
# publication. Every accepted pointer is checked against the newest successful manual
# main CI commit and byte-compared with its source. Historical push CI is never release
# evidence.

on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: audit-cn-plugin-mirror
  cancel-in-progress: true

jobs:
  dispatch_guard:
    name: Reject non-official or non-main audit dispatch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed instead of reporting a skipped-success audit
        env:
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "${DISPATCH_REPOSITORY}" = 'acosmi/CrabCode-Plugin' ] || {
            echo "::error::mirror audit is allowed only from acosmi/CrabCode-Plugin"
            exit 1
          }
          [ "${DISPATCH_REF}" = 'refs/heads/main' ] || {
            echo "::error::mirror audit is allowed only from refs/heads/main"
            exit 1
          }

  audit:
    name: Verify latest green release on CN mirror
    needs: dispatch_guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIRROR_BASE: https://updates.acosmi.com/crabcode/plugins/crabcode-plugins-official
      ARCHIVE_PREFIX: marketplaces/crabcode-plugins-official/

    steps:
      - name: Resolve the latest successful main CI release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUNS="${RUNNER_TEMP}/ci-runs.json"
          MAIN_REF="${RUNNER_TEMP}/main-ref.json"
          RETIRED_WORKFLOW="${RUNNER_TEMP}/retired-publisher.json"
          SAFE_WORKFLOW="${RUNNER_TEMP}/safe-publisher.json"
          HISTORICAL_RUNS="${RUNNER_TEMP}/retired-publisher-runs.json"
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "${RETIRED_WORKFLOW}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/336369746'
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "${SAFE_WORKFLOW}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/publish-safe-to-cn-mirror.yml'
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "${HISTORICAL_RUNS}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/336369746/runs?per_page=100'
          python3 - "${RETIRED_WORKFLOW}" "${SAFE_WORKFLOW}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          safe = json.load(open(sys.argv[2], encoding="utf-8"))
          required = {
              "id": 336369746,
              "path": ".github/workflows/publish-to-cn-mirror.yml",
              "state": "disabled_manually",
          }
          mismatches = {
              key: {"expected": value, "actual": payload.get(key)}
              for key, value in required.items() if payload.get(key) != value
          }
          if mismatches:
              raise SystemExit(f"historical publisher is not safely retired: {mismatches}")
          safe_required = {
              "path": ".github/workflows/publish-safe-to-cn-mirror.yml",
              "state": "active",
          }
          safe_mismatches = {
              key: {"expected": value, "actual": safe.get(key)}
              for key, value in safe_required.items() if safe.get(key) != value
          }
          safe_id = safe.get("id")
          if not isinstance(safe_id, int) or safe_id <= 0 or safe_id == 336369746:
              safe_mismatches["id"] = {
                  "expected": "positive ID distinct from 336369746",
                  "actual": safe_id,
              }
          if safe_mismatches:
              raise SystemExit(f"safe publisher identity is invalid: {safe_mismatches}")
          PY
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "${RUNS}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&per_page=100'
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "${MAIN_REF}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/git/ref/heads/main'
          read -r SHA CI_URL < <(python3 - "${RUNS}" <<'PY'
          import json, re, sys
          runs = json.load(open(sys.argv[1], encoding="utf-8")).get("workflow_runs", [])
          successful = [
              item for item in runs
              if item.get("status") == "completed"
              and item.get("conclusion") == "success"
              and item.get("event") == "workflow_dispatch"
              and item.get("head_branch") == "main"
              and item.get("path") == ".github/workflows/ci.yml"
          ]
          successful.sort(key=lambda item: item.get("created_at", ""), reverse=True)
          run = successful[0] if successful else None
          if run is None or not re.fullmatch(r"[0-9a-f]{40}", str(run.get("head_sha", ""))):
              raise SystemExit("no successful workflow_dispatch main ci.yml run with a valid SHA")
          print(run["head_sha"], run["html_url"])
          PY
          )
          API_MAIN_SHA="$(python3 - "${MAIN_REF}" <<'PY'
          import json, re, sys
          sha = (json.load(open(sys.argv[1], encoding="utf-8")).get("object") or {}).get("sha", "")
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit(f"GitHub main ref did not return one lowercase SHA: {sha!r}")
          print(sha)
          PY
          )"
          [ "${SHA}" = "${DISPATCH_SHA}" ] || {
            echo "::error::newest successful manual CI ${SHA} != audit dispatch SHA ${DISPATCH_SHA}; main advanced without exact CI"
            exit 1
          }
          [ "${API_MAIN_SHA}" = "${DISPATCH_SHA}" ] || {
            echo "::error::GitHub main is now ${API_MAIN_SHA} != audit dispatch SHA ${DISPATCH_SHA}; refusing stale audit"
            exit 1
          }
          {
            echo "latest_sha=${SHA}"
            echo "latest_ci_url=${CI_URL}"
          } >> "${GITHUB_OUTPUT}"
          echo "Latest successful release is ${SHA} from ${CI_URL}"

      - name: Require the served pointer to equal the newest manual CI
        id: target
        env:
          LATEST_SHA: ${{ steps.release.outputs.latest_sha }}
          LATEST_CI_URL: ${{ steps.release.outputs.latest_ci_url }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/mirror-audit"
          mkdir -p "${WORK}"
          curl -fsSL --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
            -H 'Cache-Control: no-cache' \
            -D "${WORK}/latest.headers" -o "${WORK}/latest" "${MIRROR_BASE}/latest"
          POINTER="$(python3 - "${WORK}/latest" <<'PY'
          import pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          if re.fullmatch(b"[0-9a-f]{40}", raw) is None:
              raise SystemExit(f"mirror latest is not exactly one 40-byte lowercase SHA: {raw!r}")
          print(raw.decode("ascii"))
          PY
          )"
          [ "${POINTER}" = "${LATEST_SHA}" ] || {
            echo "::error::manual audit requires newest manual green ${LATEST_SHA}, mirror serves ${POINTER}"
            exit 1
          }
          {
            echo "sha=${POINTER}"
            echo "ci_url=${LATEST_CI_URL}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out the exact release for byte-level comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: expected-source
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck origin main before byte audit
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git -C expected-source fetch --force --no-tags \
            origin refs/heads/main:refs/remotes/origin/main
          RUNTIME_MAIN="$(git -C expected-source rev-parse refs/remotes/origin/main)"
          [ "${RUNTIME_MAIN}" = "${EXPECTED_SHA}" ] || {
            echo "::error::origin/main advanced to ${RUNTIME_MAIN} after audit dispatch; expected ${EXPECTED_SHA}"
            exit 1
          }

      - name: Require exact-main local matrix attestation
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          EXPECTED_TREE="$(git -C expected-source rev-parse "${EXPECTED_SHA}^{tree}")"
          python3 expected-source/scripts/validate-retired-publisher.py \
            --workflow-json "${RUNNER_TEMP}/retired-publisher.json" \
            --safe-workflow-json "${RUNNER_TEMP}/safe-publisher.json" \
            --control-evidence-json \
              expected-source/docs/audit/evidence/2026-08-23-mcp-remediation/historical-publish-run-retirement.json \
            --historical-runs-json "${RUNNER_TEMP}/retired-publisher-runs.json"
          EVIDENCE_TAG="mcp-remediation-tested-${EXPECTED_SHA}"
          git -C expected-source fetch --force --no-tags origin \
            "refs/tags/${EVIDENCE_TAG}:refs/tags/${EVIDENCE_TAG}"
          [ "$(git -C expected-source cat-file -t "refs/tags/${EVIDENCE_TAG}")" = tag ] || {
            echo "::error::${EVIDENCE_TAG} must be an annotated tag"
            exit 1
          }
          [ "$(git -C expected-source rev-parse "refs/tags/${EVIDENCE_TAG}^{commit}")" = "${EXPECTED_SHA}" ] || {
            echo "::error::${EVIDENCE_TAG} does not peel to ${EXPECTED_SHA}"
            exit 1
          }
          ALLOWED_SIGNERS="${GITHUB_WORKSPACE}/expected-source/docs/audit/keys/mcp-remediation-test-allowed-signers"
          git -C expected-source \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="${ALLOWED_SIGNERS}" \
            verify-tag "refs/tags/${EVIDENCE_TAG}"
          LOGS_TAG="mcp-remediation-logs-${EXPECTED_SHA}"
          git -C expected-source fetch --force --no-tags origin \
            "refs/tags/${LOGS_TAG}:refs/tags/${LOGS_TAG}"
          [ "$(git -C expected-source cat-file -t "refs/tags/${LOGS_TAG}")" = tag ] || {
            echo "::error::${LOGS_TAG} must be an annotated tag"
            exit 1
          }
          git -C expected-source \
            -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="${ALLOWED_SIGNERS}" \
            verify-tag "refs/tags/${LOGS_TAG}"
          LOGS_COMMIT="$(git -C expected-source rev-parse "refs/tags/${LOGS_TAG}^{commit}")"
          LOGS_TREE="$(git -C expected-source rev-parse "${LOGS_COMMIT}^{tree}")"
          ATTESTATION="${RUNNER_TEMP}/local-test-attestation.json"
          git -C expected-source show "${LOGS_COMMIT}:attestation.json" > "${ATTESTATION}"
          python3 expected-source/scripts/validate-local-test-attestation.py \
            --attestation-json "${ATTESTATION}" \
            --expected-commit "${EXPECTED_SHA}" \
            --expected-tree "${EXPECTED_TREE}" \
            --release-contract-json \
              expected-source/docs/audit/evidence/2026-08-23-mcp-remediation/remediation-release.json \
            --git-repo expected-source \
            --logs-commit "${LOGS_COMMIT}" \
            --logs-tree "${LOGS_TREE}" \
            --matrix-contract-json \
              expected-source/docs/audit/evidence/2026-08-23-mcp-remediation/local-test-matrix-contract.json

      - name: Verify mirror pointer, index, archive, and path safety
        env:
          SHA: ${{ steps.target.outputs.sha }}
          CI_URL: ${{ steps.target.outputs.ci_url }}
          LATEST_SHA: ${{ steps.release.outputs.latest_sha }}
          LATEST_CI_URL: ${{ steps.release.outputs.latest_ci_url }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/mirror-audit"
          mkdir -p "${WORK}"
          FAIL_HINT="Run publish-safe-to-cn-mirror.yml with required ci_run_id and expected_sha inputs for the exact main commit"
          fetch() {
            curl -fsSL --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
              -H 'Cache-Control: no-cache' "$@"
          }
          fail() {
            echo "::error::$1"
            echo "${FAIL_HINT}"
            exit 1
          }

          fetch -D "${WORK}/marketplace.headers" -o "${WORK}/marketplace.json" "${MIRROR_BASE}/marketplace.json" \
            || fail "mirror marketplace.json is unreachable"
          cmp -s expected-source/.crabcode-plugin/marketplace.json "${WORK}/marketplace.json" \
            || fail "mirror marketplace.json does not byte-match ${SHA}"

          fetch -D "${WORK}/zip.headers" -o "${WORK}/${SHA}.zip" "${MIRROR_BASE}/${SHA}.zip" \
            || fail "mirror archive ${SHA}.zip is unreachable"
          fetch -o "${WORK}/${SHA}.zip.sha256" "${MIRROR_BASE}/${SHA}.zip.sha256" \
            || fail "mirror archive checksum ${SHA}.zip.sha256 is unreachable"
          fetch -D "${WORK}/marketplace-checksum.headers" -o "${WORK}/marketplace.json.sha256" "${MIRROR_BASE}/marketplace.json.sha256" \
            || fail "mirror marketplace checksum is unreachable"
          python3 - "${WORK}/latest.headers" "${WORK}/marketplace.headers" "${WORK}/marketplace-checksum.headers" <<'PY' \
            || fail "mutable mirror responses advertise an unsafe cache lifetime"
          import pathlib, re, sys
          for raw_path in sys.argv[1:]:
              path = pathlib.Path(raw_path)
              headers = path.read_text(encoding="iso-8859-1").lower()
              cache_lines = re.findall(r"^cache-control:\s*(.+)$", headers, flags=re.MULTILINE)
              directives = ",".join(cache_lines)
              parts = {part.strip() for part in directives.split(",")}
              if "immutable" in directives:
                  raise SystemExit(f"mutable response is immutable: {path.name}")
              ages = [
                  int(value)
                  for value in re.findall(r"(?:s-maxage|max-age)\s*=\s*\"?(\d+)\"?", directives)
              ]
              if not ({"no-store", "no-cache"} & parts) and not ages:
                  raise SystemExit(f"mutable response lacks an explicit safe freshness policy: {path.name}")
              if ages and max(ages) > 300:
                  raise SystemExit(f"mutable response cache lifetime exceeds 300s: {path.name}")
              if path.name == "latest.headers" and not ({"no-store", "no-cache"} & parts):
                  raise SystemExit("latest must require revalidation via no-cache or no-store")
          PY
          python3 - "${WORK}/zip.headers" <<'PY' \
            || fail "content-addressed ZIP lacks a one-year immutable cache policy"
          import pathlib, re, sys
          headers = pathlib.Path(sys.argv[1]).read_text(encoding="iso-8859-1").lower()
          directives = ",".join(re.findall(r"^cache-control:\s*(.+)$", headers, flags=re.MULTILINE))
          ages = [int(value) for value in re.findall(r"max-age\s*=\s*\"?(\d+)\"?", directives)]
          if "immutable" not in directives or not ages or min(ages) < 31_536_000:
              raise SystemExit("unsafe ZIP cache policy")
          PY
          python3 - "${WORK}" "${SHA}" <<'PY' \
            || fail "published checksum files are unsafe or do not match mirror bytes"
          import hashlib, pathlib, re, sys
          work, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          for checksum_name, payload_name in (
              (f"{sha}.zip.sha256", f"{sha}.zip"),
              ("marketplace.json.sha256", "marketplace.json"),
          ):
              line = (work / checksum_name).read_text(encoding="ascii")
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9._-]+)\n?", line)
              if match is None or match.group(2) != payload_name:
                  raise SystemExit(f"invalid checksum record: {checksum_name}")
              actual = hashlib.sha256((work / payload_name).read_bytes()).hexdigest()
              if actual != match.group(1):
                  raise SystemExit(f"checksum mismatch: {payload_name}")
          PY
          unzip -tq "${WORK}/${SHA}.zip" >/dev/null \
            || fail "mirror archive ${SHA}.zip failed CRC validation"
          python3 expected-source/scripts/build-deterministic-mirror-archive.py \
            --repo expected-source --commit "${SHA}" \
            --prefix "${ARCHIVE_PREFIX}" \
            --output "${WORK}/${SHA}.expected.zip" \
            --existing-archive "${WORK}/${SHA}.zip" \
            || fail "mirror archive bytes are not the canonical deterministic archive for ${SHA}"
          python3 - "${WORK}/${SHA}.zip" expected-source "${ARCHIVE_PREFIX}" <<'PY'
          import json, pathlib, stat, sys, zipfile

          archive = pathlib.Path(sys.argv[1])
          source = pathlib.Path(sys.argv[2])
          prefix = sys.argv[3].rstrip("/") + "/"

          # Mirror distribution trim manifest (W-PLUGIN-MIRROR-SLIM, 2026-08-16).
          # The publisher (this repository's publish-safe-to-cn-mirror.yml) reads
          # the SAME file from the SAME commit it packs; we read it from the exact
          # checkout of the served SHA, so both sides derive their file sets from
          # one source and cannot diverge — the opposite of the one-sided contract
          # upgrades that broke this audit three times before. Absent manifest =
          # no exclusions = the legacy full-tree contract, byte for byte.
          # Safety rail (mirrored on the publisher side): every exclude prefix must
          # contain "/tests/", so the manifest can only ever carve out test assets,
          # never runtime content (plugin manifests / dist / skills).
          manifest_path = source / ".crabcode-plugin" / "mirror-distribution.json"
          exclude_prefixes = []
          if manifest_path.exists():
              manifest = json.load(manifest_path.open(encoding="utf-8"))
              exclude_prefixes = manifest.get("excludePrefixes", [])
              if not isinstance(exclude_prefixes, list) or not all(
                  isinstance(p, str) for p in exclude_prefixes
              ):
                  raise SystemExit("mirror-distribution excludePrefixes must be a string array")
              for p in exclude_prefixes:
                  if "/tests/" not in p:
                      raise SystemExit(f"mirror-distribution exclude prefix must stay under /tests/: {p}")
                  if p.startswith("/") or "\\" in p or ".." in p.split("/"):
                      raise SystemExit(f"mirror-distribution exclude prefix must be repo-relative POSIX: {p}")
          with zipfile.ZipFile(archive) as bundle:
              all_infos = bundle.infolist()
              if not all_infos or len({item.filename for item in all_infos}) != len(all_infos):
                  raise SystemExit("archive is empty or contains duplicate names")
              for info in all_infos:
                  pure = pathlib.PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if (info.filename.startswith("/") or "\\" in info.filename or ".." in pure.parts
                          or not info.filename.startswith(prefix) or stat.S_ISLNK(mode)):
                      raise SystemExit(f"unsafe archive entry: {info.filename}")
              archived = {
                  info.filename[len(prefix):]: info
                  for info in all_infos if not info.is_dir()
              }
              local = {}
              excluded_count = 0
              for path in source.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(f"release source contains unsupported symlink: {path}")
                  if not path.is_file() or ".git" in path.parts:
                      continue
                  rel = path.relative_to(source).as_posix()
                  if any(rel.startswith(p) for p in exclude_prefixes):
                      excluded_count += 1
                      continue
                  local[rel] = path
              if set(local) != set(archived):
                  missing = sorted(set(local) - set(archived))[:20]
                  extra = sorted(set(archived) - set(local))[:20]
                  raise SystemExit(f"archive file set mismatch; missing={missing} extra={extra}")
              if exclude_prefixes:
                  print(f"mirror-distribution trim: {excluded_count} files excluded from the expected set")
              for name, path in local.items():
                  info = archived[name]
                  if path.read_bytes() != bundle.read(info):
                      raise SystemExit(f"archive content mismatch: {name}")
                  local_exec = bool(path.stat().st_mode & stat.S_IXUSR)
                  archive_exec = bool((info.external_attr >> 16) & stat.S_IXUSR)
                  if local_exec != archive_exec:
                      raise SystemExit(f"archive executable mode mismatch: {name}")
          print(f"verified archive files={len(local)} prefix={prefix}")
          PY

          fetch -D "${WORK}/marketplace.final.headers" \
            -o "${WORK}/marketplace.final.json" \
            "${MIRROR_BASE}/marketplace.json" \
            || fail "mirror marketplace.json became unreachable during the audit"
          fetch -D "${WORK}/marketplace-checksum.final.headers" \
            -o "${WORK}/marketplace.final.json.sha256" \
            "${MIRROR_BASE}/marketplace.json.sha256" \
            || fail "mirror marketplace checksum became unreachable during the audit"
          cmp -s expected-source/.crabcode-plugin/marketplace.json "${WORK}/marketplace.final.json" \
            || fail "mirror marketplace.json changed during the audit"
          python3 - "${WORK}/marketplace.final.json" "${WORK}/marketplace.final.json.sha256" <<'PY' \
            || fail "mirror marketplace checksum changed during the audit"
          import hashlib, pathlib, re, sys
          payload = pathlib.Path(sys.argv[1])
          checksum = pathlib.Path(sys.argv[2]).read_text(encoding="ascii")
          match = re.fullmatch(r"([0-9a-f]{64})  marketplace\.json\n?", checksum)
          if match is None or match.group(1) != hashlib.sha256(payload.read_bytes()).hexdigest():
              raise SystemExit("final marketplace checksum mismatch")
          PY
          fetch -H 'Cache-Control: no-cache' \
            -D "${WORK}/latest.final.headers" \
            -o "${WORK}/latest.final" \
            "${MIRROR_BASE}/latest" \
            || fail "mirror latest became unreachable during the audit"
          python3 - \
            "${WORK}/latest.final" \
            "${WORK}/latest.final.headers" \
            "${WORK}/marketplace.final.headers" \
            "${WORK}/marketplace-checksum.final.headers" \
            "${SHA}" <<'PY' \
            || fail "mutable mirror state or cache policy changed during the audit"
          import pathlib, re, sys
          pointer_path = pathlib.Path(sys.argv[1])
          latest_headers_path = pathlib.Path(sys.argv[2])
          mutable_headers = [pathlib.Path(value) for value in sys.argv[2:5]]
          expected = sys.argv[5]
          raw = pointer_path.read_bytes()
          if raw != expected.encode("ascii"):
              raise SystemExit(f"mirror latest changed during audit: {raw!r}")
          for headers_path in mutable_headers:
              headers = headers_path.read_text(encoding="iso-8859-1").lower()
              cache_lines = re.findall(r"^cache-control:\s*(.+)$", headers, flags=re.MULTILINE)
              directives = ",".join(cache_lines)
              parts = {part.strip() for part in directives.split(",")}
              ages = [
                  int(value)
                  for value in re.findall(r"(?:s-maxage|max-age)\s*=\s*\"?(\d+)\"?", directives)
              ]
              if "immutable" in directives:
                  raise SystemExit(f"mutable response became immutable: {headers_path.name}")
              if not ({"no-store", "no-cache"} & parts) and not ages:
                  raise SystemExit(f"mutable response lost explicit freshness: {headers_path.name}")
              if ages and max(ages) > 300:
                  raise SystemExit(f"mutable response cache lifetime exceeds 300s: {headers_path.name}")
              if headers_path == latest_headers_path and not ({"no-store", "no-cache"} & parts):
                  raise SystemExit("mirror latest no longer requires revalidation")
          PY

          # The byte audit can take minutes. Recheck main at the final verdict so
          # an intervening merge cannot leave an already-stale audit green.
          RETIRED_FINAL="${RUNNER_TEMP}/retired-publisher-final.json"
          SAFE_FINAL="${RUNNER_TEMP}/safe-publisher-final.json"
          HISTORICAL_RUNS_FINAL="${RUNNER_TEMP}/retired-publisher-runs-final.json"
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -o "${RETIRED_FINAL}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/336369746'
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -o "${SAFE_FINAL}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/publish-safe-to-cn-mirror.yml'
          curl -fsSL --retry 4 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -o "${HISTORICAL_RUNS_FINAL}" \
            'https://api.github.com/repos/acosmi/CrabCode-Plugin/actions/workflows/336369746/runs?per_page=100'
          python3 expected-source/scripts/validate-retired-publisher.py \
            --workflow-json "${RETIRED_FINAL}" \
            --safe-workflow-json "${SAFE_FINAL}" \
            --control-evidence-json \
              expected-source/docs/audit/evidence/2026-08-23-mcp-remediation/historical-publish-run-retirement.json \
            --historical-runs-json "${HISTORICAL_RUNS_FINAL}"
          git -C expected-source fetch --force --no-tags \
            origin refs/heads/main:refs/remotes/origin/main
          FINAL_MAIN="$(git -C expected-source rev-parse refs/remotes/origin/main)"
          [ "${FINAL_MAIN}" = "${SHA}" ] || {
            echo "::error::origin/main advanced to ${FINAL_MAIN} during mirror audit; audited ${SHA}"
            exit 1
          }

          ZIP_SHA256="$(sha256sum "${WORK}/${SHA}.zip" | cut -d' ' -f1)"
          INDEX_SHA256="$(sha256sum "${WORK}/marketplace.json" | cut -d' ' -f1)"
          PLUGINS="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["plugins"]))' "${WORK}/marketplace.json")"
          {
            echo '## CN plugin mirror audit'
            echo
            echo "- served source CI: ${CI_URL}"
            echo "- served release SHA: \`${SHA}\`"
            echo "- newest successful CI: ${LATEST_CI_URL}"
            echo "- newest successful SHA: \`${LATEST_SHA}\`"
            echo "- CI event: \`workflow_dispatch\`"
            echo "- freshness state: \`exact\`"
            echo "- plugins: ${PLUGINS}"
            echo "- ZIP SHA-256: \`${ZIP_SHA256}\`"
            echo "- marketplace SHA-256: \`${INDEX_SHA256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Mirror is healthy and matches ${SHA}."
